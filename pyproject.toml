[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "applypilot-ai"
version = "0.1.0"
description = "Desktop GenAI app that turns a job posting URL, resume, GitHub profile and LinkedIn export into a tailored ATS-friendly resume and cover letter."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Fearplay" }]
keywords = [
    "genai",
    "resume",
    "cover-letter",
    "ats",
    "job-application",
    "pyside6",
    "qa-engineer",
    "desktop",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "PySide6>=6.7,<6.9",
    "pydantic>=2.7,<3.0",
    "python-dotenv>=1.0,<2.0",
    "requests>=2.31,<3.0",
    "beautifulsoup4>=4.12,<5.0",
    "trafilatura>=1.12,<2.0",
    "lxml>=5.0,<6.0",
    "pymupdf>=1.24,<2.0",
    "python-docx>=1.1,<2.0",
    "markdown>=3.6,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.5,<1.0",
]

[project.urls]
Homepage = "https://github.com/Fearplay/applypilot-ai"
Repository = "https://github.com/Fearplay/applypilot-ai"
Issues = "https://github.com/Fearplay/applypilot-ai/issues"

[project.scripts]
applypilot = "app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]
markers = [
    "slow: tests that take a while (still must not call real AI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
